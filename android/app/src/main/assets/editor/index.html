<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file: 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: data:">
  <style>
    html, body, #editor, #preview { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--background); color: var(--text); }
    [hidden] { display: none !important; }
    .cm-editor { height: 100%; font-family: monospace; font-size: 15px; }
    .cm-editor.cm-focused { outline: none; }
    .cm-scroller { overflow: auto; }
    .cm-content { padding: 16px 12px; caret-color: var(--primary); }
    .cm-gutters { background: var(--surface); color: var(--textMuted); border-right: 1px solid var(--border); }
    .cm-activeLine { background: var(--inputBg); }
    .cm-activeLineGutter { background: var(--inputBg); }
    #preview { box-sizing: border-box; overflow: auto; padding: 16px; font: 16px/1.5 sans-serif; overflow-wrap: anywhere; }
    #preview a { color: var(--primary); }
    #preview img { max-width: 100%; }
    #preview pre, #preview code { background: var(--inputBg); font-family: monospace; }
    #preview pre { padding: 12px; overflow: auto; border-radius: 6px; }
    #preview blockquote { margin-left: 0; padding: 4px 12px; border-left: 3px solid var(--primary); background: var(--surface); }
    #preview table { border-collapse: collapse; }
    #preview th, #preview td { border: 1px solid var(--border); padding: 4px 8px; }
  </style>
</head>
<body>
  <div id="editor"></div>
  <div id="preview" hidden></div>
  <script src="editor.js"></script>
</body>
</html>
